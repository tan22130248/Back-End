spring:
  application:
    name: Back-End
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2GB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:2GB}
  mail:
    host: ${AUTH_MAIL_HOST:smtp.gmail.com}
    port: ${AUTH_MAIL_PORT:587}
    username: ${AUTH_MAIL_USERNAME:}
    password: ${AUTH_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/web_audio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:webaudio}
    password: ${DB_PASSWORD:webaudio}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        generate_statistics: false
    show-sql: false

  main:
    lazy-initialization: true

jwt:
  secret: ${JWT_SECRET:WebAudioVOX2026SecretKeyForJWTTokenGeneration}
  expiration: ${JWT_EXPIRATION:86400000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:web-audio}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    public-domain: ${R2_PUBLIC_DOMAIN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://*.netlify.app}

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 50
      min-spare: 5

# Nén audio admin upload (cần FFmpeg trên PATH hoặc Docker)
audio:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  bitrate-kbps: ${AUDIO_BITRATE_KBPS:48}
  sample-rate: ${AUDIO_SAMPLE_RATE:22050}
  process-timeout-sec: ${AUDIO_PROCESS_TIMEOUT_SEC:1800}
  max-input-mb: ${AUDIO_MAX_INPUT_MB:2048}

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
